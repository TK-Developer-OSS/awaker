      /* "Inserts" heading turns accent when the track has at least one insert */

      /* Mixer fader row — three side-by-side columns, no overlap / no z-index games:
         [ dB gauge ][ rail + cap ][ VU ] … then free space on the right for a

         cap and the gauge ticks share one vertical mapping (`faderTop`). */
      .strip-mid {
        position: relative;
        flex: 1 1 40px;
        min-height: 40px;
        display: flex;
        gap: 3px;
        align-items: stretch;
        justify-content: flex-start;

      /* column 1: the dB reference gauge, its own box left of the rail so the

      .fader-scale {

        pointer-events: none;

        height: 1px;
        background: var(--line);
      }
      .fader-scale > b.major::after { width: 6px; background: var(--dim); }
      /* column 2: the rail (::before, centred) + the invisible <input> + the cap */
      .fader-wrap { position: relative; width: 28px; flex: none; }
      .fader-wrap::before {
        content: '';
        position: absolute;
        left: 50%;
        margin-left: -1px;
        top: 25px; /* half the cap height — keeps rail == cap travel */
        bottom: 25px;
        width: 2px;
        border-radius: 1px;
        background: var(--line);
        z-index: 0;
      }
      .strip-fader {
        -webkit-appearance: none;
        appearance: none;
        position: relative;
        z-index: 1; /* the invisible drag target */
        writing-mode: vertical-lr;
        direction: rtl; /* up = louder */
        width: 28px;
        height: 100%;
        margin: 0;
        background: transparent;
        cursor: pointer;
      }
      .strip-fader::-webkit-slider-runnable-track {
        width: 2px;
        background: transparent; /* visible rail is .fader-wrap::before */
      }
      .strip-fader::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 28px;
        height: 40px;
        border: 0;
        background: transparent; /* visible cap is .fader-cap, placed by JS */

      .fader-cap {
        position: absolute;
        left: 50%;
        margin-left: -12.5px; /* half of width */
        width: 25px;
        height: 50px;
        transform: translateY(-50%); /* `top` (from faderTop) marks the cap centre — same as a tick */
        z-index: 2;
        pointer-events: none;
        background: url('/feder.png') center / 25px 50px no-repeat;
      }
      /* .strip-vu sits right after the fader; the right edge stays free for a
         gain-reduction meter later (no margin-left:auto). */
      .strip-vu {
        width: 11px;
        border: 1px solid var(--line);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
        /* Fixed scale: only the tip that pokes into a zone shows its colour. */
        background: linear-gradient(
          to top,
          #1f9d63 0%, #1f9d63 78%,
          var(--warn) 82%, var(--warn) 88%,
          #f0912e 91%, #f0912e 97%,
          var(--rec) 99%
        );
      }
      .strip-vu > i {
        /* dark cover from the top; JS shrinks it as the level rises */
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 100%;
        background: #05140f;
      }
      .strip-nums { display: flex; gap: 4px; flex: none; }
      .strip-db {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        color: var(--dim);
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .strip-peak {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        text-align: center;
        padding: 1px 0;
        border-radius: 2px;
        background: #05140f;
      }
      .strip-peak.over { color: var(--rec); font-weight: 700; }
      /* master strip: Short-term LUFS under the dB / peak numbers */
      .strip-lufs {
        flex: none;
        font-size: 11px;
        color: var(--dim);
        text-align: center;
        font-variant-numeric: tabular-nums;
        padding: 1px 0;
      }
      .strip-lufs::before { content: '≈LUFS '; font-size: 8px; opacity: 0.6; }
      /* Maximizer window LUFS readout */
      .lufs-title {
        margin-top: 14px;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: #98a1b2;
        text-transform: uppercase;
      }
      .lufs-approx { color: var(--warn); letter-spacing: 0.06em; cursor: help; }
      .lufs-meter {
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px 12px;
        border: 1px solid #3d4557;
        border-radius: 4px;
        background: #10141b;
      }
      .lufs-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
      .ll-lab { font-size: 11px; color: #98a1b2; letter-spacing: 0.04em; }
      .ll-val {
        font-size: 15px;
        color: #eef1f6;
        font-variant-numeric: tabular-nums;
      }
      .lufs-row.lufs-strong .ll-val { color: var(--accent); font-weight: 700; }
      .strip-knob {
        width: 26px;
        height: 26px;
        justify-self: center;
        align-self: center;
        border-radius: 50%;
        background: #1b2029;
        border: 1px solid var(--line);
        position: relative;
        cursor: ns-resize;
        touch-action: none;
      }
      .strip-knob > i {
        position: absolute;
        left: 50%;
        top: 2px;
        width: 2px;
        height: 9px;
        margin-left: -1px;
        background: var(--accent);
        transform-origin: 50% 11px;
      }
      /* 2 columns: M S on the first row, R on the second (bottom-left). Square cells. */
      .strip-btns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        flex: none;
        width: 76%; /* M/S/R buttons ~10% smaller again */
        margin: 0 auto;
      }
      .strip-btns button {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
        padding: 0;
        border-radius: 3px;
        background: #1b2029;
        color: var(--dim);
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .strip-btns button.on.m { color: var(--warn); border-color: var(--warn); }
      .strip-btns button.on.s { color: var(--play); border-color: var(--play); }
      .strip-btns button.on.r { color: var(--rec); border-color: var(--rec); }

      /* ---- master strip: identical shape / fader to a channel strip, pinned
             right. Only the "MASTER" label is tinted; rail, cap, range and
             travel all match a channel fader. ---- */
      .strip.master {
        border-right: 0;
        background: #1a1417;
      }
      .strip.master .strip-head .t { color: var(--rec); letter-spacing: 0.14em; }
      #master-val {
        flex: none;
        /* reserve the same height as a channel strip's .strip-btns (2 rows of
           ~29px + 4px gap) so .strip-mid — and the fader travel — line up 1:1 */
        min-height: 62px;
        padding-top: 3px;
        font-size: 12px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      /* ---- centre: scrollable list of track lanes ---- */
      #tracks-scroll {
        flex: 1;
        min-width: 0;
        position: relative;
        overflow-y: auto;
        overflow-x: hidden;
        background: var(--bg);
      }
      #tracks { position: relative; min-height: 100%; }
      .lane {
        display: flex;
        height: var(--lane-h);
        border-bottom: 1px solid var(--line);
      }
      .lane-left {
        width: var(--lane-left);
        flex: none;
        padding: 3px 8px;
        border-right: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1px;
        overflow: hidden;
      }
      .lane-name { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
      .lane-num {
        flex: none;
        color: var(--dim);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }
      .lane-title {
        min-width: 0;
        color: var(--text);
        font-weight: 600;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lane-sub { color: var(--dim); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lane-center {
        flex: 1;
        min-width: 0;
        position: relative;
        background: var(--emerald-bar);
      }
      .lane-center canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      /* clip-chrome overlay (borders / selection / fade curves / handles) sits
         above the waveform; pointer events are handled on .lane-center itself. */
      .lane-center canvas.lane-fx { pointer-events: none; z-index: 1; }
      #tracks[data-tool='split'] .lane-center { cursor: col-resize; }
      #tracks[data-tool='erase'] .lane-center { cursor: not-allowed; }
      #tracks[data-tool='range'] .lane-center { cursor: crosshair; }
      .lane-right {
        width: var(--lane-right);
        flex: none;
        border-left: 1px solid var(--line);
        background: var(--panel);
      }

      /* ---- right pane = audio (source + clip) list ---- */
      #pane-right {
        width: var(--pane-right-w, 224px);
        flex: none;
        border-left: 1px solid var(--line);
        background: #0e1116;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      #pane-right .pr-head {
        flex: none;
        padding: 6px 10px;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
        border-bottom: 1px solid var(--line);
      }
      #audio-list { flex: 1; overflow-y: auto; padding: 0 0 12px; }
      .al-section { padding: 0 0 4px; }
      .al-section + .al-section { border-top: 1px solid var(--line); margin-top: 4px; }
      .al-section h4 {
        position: sticky;
        top: 0;
        z-index: 1;
        margin: 0;
        padding: 6px 10px 4px;
        background: #0e1116;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .al-row {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 4px 10px;
        cursor: grab;
        border-left: 2px solid transparent;
      }
      .al-row:hover { background: #1a1f29; border-left-color: var(--accent); }
      .al-row.sel { background: #1d2b24; border-left-color: var(--accent); }
      .al-row.sel .al-name { color: #7ff0c4; }
      .al-row:active { cursor: grabbing; }
      .al-name {
        font-size: 11px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .al-meta { font-size: 9px; color: var(--dim); font-variant-numeric: tabular-nums; }

      /* time grid: vertical lines over the waveform column, aligned with the top
         ruler's major ticks. Drawn ABOVE the lane canvases (grey), the playhead
         sits above the grid. */
      #grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        overflow: hidden;
      }
      #grid > i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgba(155, 164, 178, 0.16);
      }
      #grid > i.major { background: rgba(155, 164, 178, 0.32); }
      #playhead {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 100%;
        background: var(--emerald);
        pointer-events: none;
        opacity: 0;
        z-index: 5;
      }
      #hint {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: var(--dim);
        text-align: center;
        pointer-events: none;
      }

      /* ---- add-track wizard ---- */
      #wizard {
        position: fixed;
        inset: 0;
        background: rgba(4, 6, 10, 0.66);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      /* `display: flex` above outranks the UA [hidden] rule — restore it. */
      #wizard[hidden] { display: none; }
      .wizard-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 22px 24px;
        width: 340px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
      }
      .wizard-card h2 { margin: 0 0 4px; font-size: 15px; }
      .wizard-card p { margin: 0 0 16px; color: var(--dim); font-size: 12px; }
      .wizard-actions { display: flex; flex-direction: column; gap: 8px; }
      .wizard-card button {
        background: #1b2029;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 12px;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
      }
      .wizard-card button:hover { border-color: var(--emerald); }
      #wiz-cancel {
        margin-top: 14px;
        text-align: center;
        color: var(--dim);
      }
      #wiz-cancel:hover { border-color: var(--line); color: var(--text); }
    </style>
  </head>
  <body>
    <div id="transport">
      <button id="play">▶ Play</button>
      <button id="rec" title="Record armed tracks from the playhead; Stop commits the takes">● Rec</button>
      <button id="stop">■ Stop</button>
      <span class="clock" id="clock">0:00.000</span>
      <span id="toolbar">
        <button data-tool="select" class="tool on" title="Select — move / trim edges / fade corners  (1)">
          <span class="ti">⬍</span><span class="tc">Select</span>
        </button>
        <button data-tool="split" class="tool" title="Split — click a clip to cut it at that point  (2)">
          <span class="ti">✂</span><span class="tc">Split</span>
        </button>
        <button data-tool="range" class="tool" title="Range — drag to mark a time span (no edit; use Edit menu / Ctrl+X…)  (3)">
          <span class="ti">▨</span><span class="tc">Range</span>
        </button>
      </span>
      <button id="add-track">＋ Add Track</button>
      <button id="proj-save" title="Save project (Ctrl+S)">💾 Save</button>
      <button id="proj-saveas" title="Save project to a file…">Save As…</button>
      <button id="proj-open" title="Open a project file…">📂 Open</button>
      <label>Project
        <select id="sr" title="192 kHz keeps 2× the audio in VRAM per track — for big-VRAM GPUs / few tracks">
          <option value="44100">44.1k</option>
          <option value="48000">48k</option>
          <option value="96000" selected>96k</option>
          <option value="192000">192k</option>
        </select>
        <span class="fmt">· 32f</span>
      </label>
      <span id="metrics"></span>
      <span class="spacer"></span>
      <span id="gpu-status">initializing WebGPU…</span>
    </div>

    <div id="workspace">
      <div id="pane-left" class="pane">
        <div id="track-detail"><div class="td-empty">select a track</div></div>
      </div>
      <div id="workspace-main">
        <div id="pane-top">
          <canvas id="ruler-canvas"></canvas>
          <span id="ruler-tc">0:00.000</span>
        </div>
        <div id="workspace-mid">
          <div id="tracks-scroll">
            <div id="tracks"><div id="grid"></div><div id="playhead"></div></div>
            <div id="hint">
              No tracks yet.<br />
              Press <b>＋ Add Track</b> to pick a WAV.
            </div>
          </div>
          <div id="pane-right">
            <div class="pr-head">Audio</div>
            <div id="audio-list"></div>
          </div>
        </div>
        <div id="pane-bottom" class="pane">
          <div id="strips-scroll"><div id="strips"></div></div>
          <div class="strip master" id="master-strip">
          <div class="strip-head"><span class="t">MASTER</span></div>
          <div class="strip-rack" id="master-rack"></div>
          <div class="strip-mid">
            <div class="fader-wrap">
              <input id="master" class="strip-fader" type="range" min="-60" max="6" step="0.5" value="-10" />
            </div>
            <div class="strip-vu"><i></i></div>
          </div>
          <div class="strip-nums">
            <div class="strip-db" id="master-db" title="master level">−∞</div>
            <div class="strip-peak" id="master-peak" title="peak — click to reset">−∞</div>
          </div>
          <div class="strip-lufs" id="master-lufs" title="short-term loudness — BS.1770 K-weighting + provisional +2 dB trim (almost, pending reference check)">−∞</div>
          <div id="master-val">-10.0 dB</div>
          </div>
        </div>
      </div>
    </div>

    <div id="wizard" hidden>
      <div class="wizard-card">
        <h2>New track</h2>
        <p>Pick one or more WAVs — one track per file, named from the filename.</p>
        <div class="wizard-actions">
          <button id="wiz-wav">Select WAV file(s)…</button>
          <button id="wiz-tone">GPU demo tone</button>
        </div>
        <button id="wiz-cancel">Cancel</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
